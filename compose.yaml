services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sistemandrestudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-sistemandrestudio}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-sistemandrestudio_test}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-sistemandrestudio_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local-app-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - sistemandrestudio_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL: "false"
      ORCHESTRATION_API_HOST: 0.0.0.0
      ORCHESTRATION_API_PORT: "4317"
      ORCHESTRATION_API_ALLOW_CONTAINER_BIND: "true"
      HUMAN_DECISION_CHANNEL: CONSOLE
      DRY_RUN_ORCHESTRATION: "true"
    ports:
      - "127.0.0.1:${ORCHESTRATION_API_PORT:-4317}:4317"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4317/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  sistemandrestudio_postgres_data:
    name: sistemandrestudio_postgres_data
